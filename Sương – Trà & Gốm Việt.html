<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sương – Trà &amp; Gốm Việt</title>
<meta name="description" content="Sương: cửa hàng trà và gốm Việt, song ngữ Việt – Anh. Cửa hàng minh họa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EC;--surface:#fff;--ink:#1B2A2A;--mute:#586966;--line:#D3DCD6;--jade:#1F5C4D;--on:#fff;--lotus:#B8456C;--ok:#1F7A4D;--err:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101816;--surface:#18231F;--ink:#E6EEEA;--mute:#9BADA7;--line:#2A3A35;--jade:#7CCBB0;--on:#0E1A16;--lotus:#E58AA9;--ok:#6FD39A;--err:#FF8A80}}
:root[data-theme="dark"]{--bg:#101816;--surface:#18231F;--ink:#E6EEEA;--mute:#9BADA7;--line:#2A3A35;--jade:#7CCBB0;--on:#0E1A16;--lotus:#E58AA9;--ok:#6FD39A;--err:#FF8A80}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lotus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--jade);text-decoration:none}
nav{display:flex;gap:20px;margin-left:auto}
nav a{color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{color:var(--jade)}
.tools{display:flex;gap:8px;margin-left:auto}
nav+.tools{margin-left:0}
.ib{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-weight:500}
.ib:hover{border-color:var(--jade)}
.btn{min-height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--jade);color:var(--on);font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:40px;padding:0 14px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;padding:64px 0 48px}
h1{font-size:clamp(36px,6vw,64px);line-height:1.08;letter-spacing:-.03em;margin:0 0 16px;font-weight:700}
.hero p{max-width:48ch;color:var(--mute);margin:0 0 28px;font-size:18px}
.hero h1,.hero p,.hero .btn{animation:rise .8s both}
.hero p{animation-delay:.15s}.hero .btn{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cup{width:100%;max-width:340px;justify-self:center;color:var(--jade)}
.steam path{fill:none;stroke:var(--lotus);stroke-width:3;stroke-linecap:round;animation:steam 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 24px}
.bar h2{margin:0 auto 0 0;font-size:28px;letter-spacing:-.02em}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--jade);color:var(--on);border-color:var(--jade)}
input[type=search],.f input{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
input[type=search]{width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--jade)}
.tile{aspect-ratio:4/3;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,hsl(var(--h) 45% 45%) 20%,var(--surface));color:hsl(var(--h) 45% 42%)}
.tile svg{width:38%}
.card h3{font-size:17px;margin:14px 4px 4px;line-height:1.3}
.card p{font-size:14px;color:var(--mute);margin:0 4px 14px;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 4px}
.none{color:var(--mute);grid-column:1/-1}
.about{margin:72px 0;padding:32px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.about h2{margin:0 0 8px;font-size:24px}.about p{margin:0;color:var(--mute);max-width:62ch}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--mute);font-size:14px}
.demo{display:inline-block;margin-top:8px;color:var(--lotus);font-weight:500}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;visibility:hidden}
body.open .ov{opacity:1;pointer-events:auto}
body.open aside{transform:none;visibility:visible}
aside header{position:static;border:0;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
aside h2{margin:0;font-size:22px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
li small{display:block;color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:16px 0}
.f label{display:block;font-size:14px;font-weight:500;margin-top:12px}
.f input[aria-invalid="true"]{border-color:var(--err)}
.er{color:var(--err);font-size:13px;min-height:18px;margin:2px 0 0}
.f .btn{width:100%;margin-top:16px}
.ok{background:var(--surface);border:1px solid var(--ok);border-radius:12px;padding:16px;color:var(--ink)}
.ok b{color:var(--ok)}
[hidden]{display:none!important}
@media (max-width:720px){nav{display:none}.tools{margin-left:auto}.hero{grid-template-columns:1fr;padding:40px 0 32px}.cup{max-width:200px;order:-1;justify-self:start}input[type=search]{width:100%}.bar h2{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap">
<a class="brand" href="#top">Sương</a>
<nav><a href="#shop" data-k="shop"></a><a href="#about" data-k="about"></a></nav>
<div class="tools">
<button class="ib" id="lang" aria-label="Language">EN</button>
<button class="ib" id="openCart" aria-label="Cart"><span data-k="cart"></span> (<span id="count">0</span>)</button>
</div></div></header>

<main id="top" class="wrap">
<section class="hero">
<div>
<h1 data-k="h1"></h1>
<p data-k="h2"></p>
<a href="#shop"><button class="btn" data-k="cta"></button></a>
</div>
<svg class="cup" viewBox="0 0 200 180" role="img" aria-label="Tea cup">
<g class="steam"><path d="M80 60c-10-12 10-18 0-32"/><path d="M104 60c-10-12 10-18 0-32"/><path d="M128 60c-10-12 10-18 0-32"/></g>
<path d="M30 80h140c0 44-28 70-70 70S30 124 30 80z" fill="currentColor"/>
<rect x="64" y="150" width="72" height="8" rx="4" fill="currentColor"/>
</svg>
</section>

<section id="shop">
<div class="bar">
<h2 data-k="shop"></h2>
<button class="chip" data-cat="all" aria-pressed="true" data-k="all"></button>
<button class="chip" data-cat="tea" aria-pressed="false" data-k="tea"></button>
<button class="chip" data-cat="ware" aria-pressed="false" data-k="ware"></button>
<input type="search" id="q" data-p="search" aria-label="Search">
</div>
<div class="grid" id="grid"></div>
</section>

<section class="about" id="about">
<h2 data-k="aboutT"></h2><p data-k="aboutP"></p>
</section>
</main>

<footer><div class="wrap">
<div>© 2026 Sương</div>
<span class="demo" data-k="demo"></span>
</div></footer>

<div class="ov" id="ov"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Cart" aria-hidden="true">
<header><h2 data-k="cart"></h2><button class="ib" id="closeCart" data-k="close"></button></header>
<ul id="items"></ul>
<div class="tot" id="totrow"><span data-k="total"></span><span id="total"></span></div>
<form class="f" id="form" novalidate>
<label for="n" data-k="name"></label><input id="n" autocomplete="name"><p class="er" id="en"></p>
<label for="ph" data-k="phone"></label><input id="ph" inputmode="tel" autocomplete="tel"><p class="er" id="ep"></p>
<label for="ad" data-k="addr"></label><input id="ad" autocomplete="street-address"><p class="er" id="ea"></p>
<button class="btn" id="sub" type="submit" data-k="place"></button>
</form>
<div class="ok" id="done" role="status" hidden></div>
</aside>

<script>
const LEAF='<svg viewBox="0 0 64 64"><path d="M12 52C12 26 30 10 54 10c0 26-16 42-38 42z" fill="currentColor"/></svg>';
const BOWL='<svg viewBox="0 0 64 64"><path d="M8 26h48c0 18-10 28-24 28S8 44 8 26z" fill="currentColor"/><rect x="22" y="54" width="20" height="4" rx="2" fill="currentColor"/></svg>';
const P=[
{id:1,c:"tea",h:150,p:285000,n:{vi:"Trà Shan tuyết Hà Giang",en:"Ha Giang snow Shan tea"},d:{vi:"Búp trà cổ thụ, vị ngọt hậu.",en:"Old-tree buds with a sweet finish."}},
{id:2,c:"tea",h:95,p:240000,n:{vi:"Ô long Cầu Đất",en:"Cau Dat oolong"},d:{vi:"Hương hoa nhẹ, vị tròn.",en:"Light floral aroma, round body."}},
{id:3,c:"tea",h:20,p:180000,n:{vi:"Hồng trà Mộc Châu",en:"Moc Chau black tea"},d:{vi:"Đậm vị, hợp pha cùng sữa.",en:"Bold flavor, good with milk."}},
{id:4,c:"tea",h:330,p:420000,n:{vi:"Trà sen Tây Hồ",en:"West Lake lotus tea"},d:{vi:"Trà ướp sen, thơm dịu.",en:"Tea scented with lotus, gently fragrant."}},
{id:5,c:"ware",h:25,p:520000,n:{vi:"Ấm đất nung Bát Tràng",en:"Bat Trang clay teapot"},d:{vi:"Dung tích 250 ml, giữ nhiệt tốt.",en:"250 ml, holds heat well."}},
{id:6,c:"ware",h:170,p:360000,n:{vi:"Bộ chén men ngọc",en:"Celadon cup set"},d:{vi:"Một bộ gồm 4 chén nhỏ.",en:"A set of 4 small cups."}},
{id:7,c:"ware",h:45,p:290000,n:{vi:"Khay trà tre",en:"Bamboo tea tray"},d:{vi:"Có ngăn thoát nước.",en:"With a water drain."}},
{id:8,c:"ware",h:200,p:210000,n:{vi:"Bình pha lạnh thủy tinh",en:"Glass cold-brew bottle"},d:{vi:"Dung tích 800 ml, có lưới lọc.",en:"800 ml with a built-in filter."}}];
const T={
vi:{shop:"Sản phẩm",about:"Về Sương",cart:"Giỏ hàng",h1:"Trà núi, gốm làng, pha thật chậm.",h2:"Trà từ các vùng núi Việt Nam và đồ gốm làm thủ công, chọn để bạn pha một ấm trà ngon tại nhà.",cta:"Xem sản phẩm",all:"Tất cả",tea:"Trà",ware:"Dụng cụ",search:"Tìm sản phẩm",add:"Thêm vào giỏ",empty:"Giỏ hàng đang trống. Chọn một sản phẩm để bắt đầu.",none:"Không tìm thấy sản phẩm phù hợp. Thử từ khóa khác.",total:"Tổng cộng",name:"Họ và tên",phone:"Số điện thoại",addr:"Địa chỉ nhận hàng",place:"Đặt hàng",sending:"Đang gửi...",close:"Đóng",eN:"Nhập họ và tên (ít nhất 2 ký tự).",eP:"Nhập số điện thoại Việt Nam hợp lệ, ví dụ 0912345678.",eA:"Nhập địa chỉ nhận hàng (ít nhất 8 ký tự).",done:"Đã đặt hàng thành công. Mã đơn:",doneNote:"Đây là cửa hàng minh họa: đơn hàng chưa được gửi đến ai.",aboutT:"Về Sương",aboutP:"Sương là cửa hàng minh họa cho trà và gốm Việt. Sản phẩm, giá và mô tả bên dưới là dữ liệu mẫu để thử giao diện và luồng mua hàng.",demo:"Cửa hàng minh họa: dữ liệu mẫu, chưa có thanh toán hay giao hàng thật."},
en:{shop:"Shop",about:"About",cart:"Cart",h1:"Mountain tea, village clay, brewed slowly.",h2:"Tea from Vietnam’s highlands and handmade ceramics, picked so you can brew a good pot at home.",cta:"Browse products",all:"All",tea:"Tea",ware:"Teaware",search:"Search products",add:"Add to cart",empty:"Your cart is empty. Pick a product to start.",none:"No matching products. Try another keyword.",total:"Total",name:"Full name",phone:"Phone number",addr:"Delivery address",place:"Place order",sending:"Sending...",close:"Close",eN:"Enter your full name (at least 2 characters).",eP:"Enter a valid Vietnamese phone number, e.g. 0912345678.",eA:"Enter a delivery address (at least 8 characters).",done:"Order placed. Order code:",doneNote:"This is a demo store: the order was not sent to anyone.",aboutT:"About Sương",aboutP:"Sương is a demo store for Vietnamese tea and ceramics. The products, prices and descriptions below are sample data for trying out the design and checkout flow.",demo:"Demo store: sample data, no real payment or delivery."}};
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat("vi-VN").format(n)+" ₫";
let lang="vi",cat="all",q="",cart={},lastCode="";
try{cart=JSON.parse(localStorage.getItem("suong-cart")||"{}");lang=localStorage.getItem("suong-lang")||"vi"}catch(e){}
if(lang!=="en")lang="vi";
const t=k=>T[lang][k];
const save=()=>{try{localStorage.setItem("suong-cart",JSON.stringify(cart))}catch(e){}};

function renderShop(){
 const l=P.filter(p=>(cat==="all"||p.c===cat)&&(p.n.vi+" "+p.n.en).toLowerCase().includes(q));
 $("#grid").innerHTML=l.length?l.map(p=>`<article class="card"><div class="tile" style="--h:${p.h}">${p.c==="tea"?LEAF:BOWL}</div><h3>${p.n[lang]}</h3><p>${p.d[lang]}</p><div class="row"><b>${fmt(p.p)}</b><button class="btn sm" data-add="${p.id}">${t("add")}</button></div></article>`).join(""):`<p class="none">${t("none")}</p>`;
}
function renderCart(){
 let tot=0,n=0;
 const ids=Object.keys(cart).filter(id=>P.some(x=>x.id==id)&&cart[id]>0);
 $("#items").innerHTML=ids.length?ids.map(id=>{const p=P.find(x=>x.id==id),k=cart[id];tot+=p.p*k;n+=k;
  return `<li><div><b>${p.n[lang]}</b><small>${fmt(p.p)}</small></div><div class="qty"><button data-dec="${id}" aria-label="-">−</button><span>${k}</span><button data-inc="${id}" aria-label="+">+</button></div></li>`}).join(""):(lastCode?"":`<li class="none">${t("empty")}</li>`);
 $("#total").textContent=fmt(tot);$("#count").textContent=n;
 $("#form").hidden=!ids.length;$("#totrow").hidden=!ids.length;
}
function renderDone(){
 const d=$("#done");d.hidden=!lastCode;
 if(lastCode)d.innerHTML=`<b>${t("done")} ${lastCode}</b><br>${t("doneNote")}`;
}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t(e.dataset.k));
 document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
 $("#lang").textContent=lang==="vi"?"EN":"VI";
 renderShop();renderCart();renderDone();
}
function setDrawer(o){
 document.body.classList.toggle("open",o);
 $("#drawer").setAttribute("aria-hidden",String(!o));
 if(o)$("#closeCart").focus();else $("#openCart").focus();
}
$("#lang").onclick=()=>{lang=lang==="vi"?"en":"vi";try{localStorage.setItem("suong-lang",lang)}catch(e){}applyLang()};
$("#openCart").onclick=()=>setDrawer(true);
$("#closeCart").onclick=$("#ov").onclick=()=>setDrawer(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")setDrawer(false)});
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderShop()});
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();renderShop()};
$("#grid").onclick=e=>{const id=e.target.dataset.add;if(!id)return;cart[id]=(cart[id]||0)+1;lastCode="";save();renderCart();renderDone();const c=$("#count");c.parentElement.animate([{transform:"scale(1.12)"},{transform:"none"}],{duration:200})};
$("#items").onclick=e=>{const d=e.target.dataset;const id=d.inc||d.dec;if(!id)return;cart[id]=(cart[id]||0)+(d.inc?1:-1);if(cart[id]<=0)delete cart[id];save();renderCart()};
$("#form").onsubmit=e=>{
 e.preventDefault();
 const v={n:$("#n").value.trim(),ph:$("#ph").value.replace(/[\s.-]/g,""),ad:$("#ad").value.trim()};
 const ok={n:v.n.length>=2,ph:/^(0|\+84)[35789]\d{8}$/.test(v.ph),ad:v.ad.length>=8};
 [["n","en","eN"],["ph","ep","eP"],["ad","ea","eA"]].forEach(([i,er,m])=>{$("#"+er).textContent=ok[i]?"":t(m);$("#"+i).setAttribute("aria-invalid",String(!ok[i]))});
 if(!(ok.n&&ok.ph&&ok.ad)){$("#"+(!ok.n?"n":!ok.ph?"ph":"ad")).focus();return}
 const b=$("#sub");b.disabled=true;b.textContent=t("sending");
 setTimeout(()=>{ // demo: no backend, order is only simulated
  lastCode="S"+Date.now().toString(36).toUpperCase();cart={};save();
  e.target.reset();b.disabled=false;b.textContent=t("place");renderCart();renderDone();
 },800);
};
applyLang();
</script>
</body>
</html>
